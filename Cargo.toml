[workspace]
resolver = "2"
members = [
    "crates/asr-audio",
    "crates/asr-core",
    "crates/asr-cli",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["LiveTranscriber"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
