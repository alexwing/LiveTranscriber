# Copy this to transcriber-config.toml. The app also writes it on its own when
# you change something in the interface, so there is no need to edit it by hand.

# Interpreter with torch and transformers. This is the model project's venv.
python = 'E:\projects\nemotron-3.5-asr-streaming-0.6b\.venv\Scripts\python.exe'
script = 'sidecar/asr_server.py'
mt_script = 'sidecar/mt_server.py'

# Translation in parallel, with NLLB-200 in a second process. Each source
# carries its own "from -> to" language pair:
#   room language     -> target_language     (what they say, what I read it in)
#   mic  mic_language -> mic_target_language (what I say, what they hear me in;
#                        the one on the right is what the voice speaks)
# Leave the mic ones alone and it is the mirror of the room: you speak in the
# language you read in and you get translated into the room's. With this on,
# `language` can NOT be "auto": NLLB needs to know it.
translate = false

# What the ROOM is translated into: the language you read everyone else in. The
# field name comes from when there was only one direction; it stays so existing
# configurations keep loading.
target_language = "en-US"

# Language of the ROOM: what plays through the system. A concrete locale
# (es-ES, en-US, fr-FR...) or "auto" so the model detects it (only valid
# without translation).
language = "auto"

# The MICROPHONE pair, only if you want something other than the mirror of the room.
# mic_language = "es-ES"
# mic_target_language = "en-US"

# Only 0, 3, 6 or 13. They are the only ones the model accepts.
#   0  -> 80 ms   lowest latency, more errors, ~1 stream on a 3060
#   3  -> 320 ms  recommended balance, ~4 streams
#   6  -> 560 ms  more accurate
#   13 -> 1120 ms highest accuracy
lookahead = 3

# bfloat16 works better and faster than float16 on this model.
dtype = "bfloat16"

capture_system = true
capture_mic = false

# null = default device. The ids come from `asr-cli devices`.
# system_device_id = "{0.0.0.00000000}.{...}"
# mic_device_id = "{0.0.1.00000000}.{...}"

# How many dB below recent speech counts as a pause. It is RELATIVE on purpose:
# the absolute level depends on the Windows volume, the difference between
# speaking and going quiet does not. Less = cuts more; more = cuts less.
gate_drop_db = 25.0
# Absolute floor, only so that digital silence always counts as silence.
# -80 lets through even the very attenuated audio that loopback gives.
gate_floor_dbfs = -80.0
# Seconds of silence before it stops feeding the model. It only affects GPU
# cost; it does not decide where paragraphs end.
gate_hold_secs = 2.0

# Paragraphs are closed when the model has gone this long WITHOUT TRANSCRIBING
# anything new. It looks at the text and not at the volume on purpose: with music
# in the background the level never drops, but music does not produce transcription
# either. Lower = shorter paragraphs and faster translation, but it cuts in the
# middle of a sentence more easily.
paragraph_idle_secs = 1.2
# Cap, so that a monologue with no pauses does not end up as one endless block.
paragraph_max_secs = 30.0

# Compensates for the Windows volume. Leave it on: loopback captures after the
# volume control, and without this a low volume leaves you no transcription.
normalize_gain = true

hotkey_toggle = "CmdOrControl+Shift+T"
hotkey_overlay = "CmdOrControl+Shift+O"
overlay_enabled = false

# Folder where the exported .txt and .srt files are saved. It has to be
# ABSOLUTE: a relative one would be resolved against the process working
# directory, which with `tauri dev` is src-tauri/, and you would not know where
# the files ended up. If there is a relative one here it is ignored and
# Documents\LiveTranscriber is used. Normally you do not edit this by hand:
# you pick it from the interface with "Change…".
output_dir = 'C:\Users\TuUsuario\Documents\LiveTranscriber'

# Base name of the file. The final name carries the date in front:
#   2026_07_28_transcript.txt
#   2026_07_28_transcript.srt
#   2026_07_28_transcript_translated.srt   (translation only)
#   2026_07_28_transcript_bilingual.txt    (original and translation)
# If one with that name exists, _2, _3... is added instead of overwriting it.
# The characters Windows does not accept (\ / : * ? " < > |) are replaced with _.
output_name = "transcript"

# ─── Synthetic voice ─────────────────────────────────────────────────────
# Speak the translation of what you say into the microphone, in your cloned voice
# or in a neutral one. It is OPTIONAL and lives in its own section: turned off it
# costs nothing (no process, no VRAM). It requires `translate = true` and
# `capture_mic = true`, because what gets spoken is the translation of your mic.
# What everyone else says is read on screen, never spoken.
#
# The virtual microphone circuit: the voice is written to CABLE Input
# (VB-CABLE, installed separately) and in the meeting you pick CABLE Output as
# the microphone. Since it does not go through the speakers, it does not feed
# back into the capture.

[speak]
enabled = false

# chatterbox -> your cloned voice. 23 languages, ~3.4 GB of VRAM, and on a 3060
#               it sits right on the edge of real time (hence the grouping).
# kokoro     -> preset neutral voice. 8 languages, ~0.6 GB, 40x real time.
engine = "chatterbox"

# Interpreter of the VOICE venv. It is not the ASR one and it cannot be: the ASR
# requires transformers>=5.13 (AutoModelForRNNT) and chatterbox-tts is tested with
# 4.57.x. Two environments, each sidecar with its own.
python = 'E:\projects\voicebox\backend\venv\Scripts\python.exe'
script = 'sidecar/tts_server.py'

# Sample of your voice to clone (chatterbox only): a WAV with 10-30 seconds of
# clean speech. The cloned voice imitates the tone of the sample.
# voice_wav = 'C:\voces\mi-voz.wav'

# Preset voice (kokoro only). The prefix says language and gender:
#   af_heart (English, f)  am_adam (English, m)
#   ef_dora  (Spanish, f)  em_alex (Spanish, m)  em_santa (Spanish, m)
kokoro_voice = "af_heart"

# Device to speak through. Without this it comes out of the speakers, which is
# almost never what you want: put the id of CABLE Input (from `asr-cli devices`).
# output_device_id = "{0.0.0.00000000}.{...}"

# How much to bundle before synthesizing. Chatterbox has ~1 s of fixed cost per
# request (measured): with single sentences it generates below real time and the
# delay grows without bound; with blocks of ~250 characters it goes above 1x and
# stays bounded. Grouping only acts while the voice is STILL PLAYING: when it is
# silent, the first sentence is synthesized right away and the following ones are
# grouped while it plays.
# The maximum wait keeps a short sentence from being left hanging in a block.
group_max_chars = 250
group_max_wait_ms = 2000

# Recognize its own synthetic voice if it comes back through the system capture and
# mark it as echo instead of re-translating it (es -> en -> es comes out weird).
mark_echo = true
